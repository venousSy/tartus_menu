# CI/CD pipeline (system_design.md §5, "CI/CD Pipeline"; implementation_plan.md step 13).
# Pull requests into main: run every check and build both images (not pushed).
# Pushes to main (merged PRs): the same, then push the images to GitHub Container Registry and deploy them
# to the VPS over SSH (only when the repository variable DEPLOY_ENABLED is "true"; deploy/README.md).
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The jobs only read the code. Jobs that need more ask for it themselves.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the older, unfinished check run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    # A throwaway PostgreSQL 16, the same image as production.
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tartus_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tartus_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    # Development settings, like a local test run. Throwaway values only: nothing here is a real secret.
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      DB_NAME: tartus_db
      DB_USER: postgres
      DB_PASSWORD: ci-only-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: System check
        run: python manage.py check
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run
      # Production settings must pass Django's deploy checklist with no warning at all
      # (the two that Nginx covers are silenced in settings.py).
      - name: Deploy check
        env:
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: menu.example.com
          DJANGO_ADMIN_PATH: ci-hidden-admin
          PUBLIC_MENU_BASE_URL: https://menu.example.com
        run: python manage.py check --deploy --fail-level WARNING
      - name: Tests
        run: python manage.py test

  frontend-tests:
    name: Frontend lint, tests and types
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      # `npm test` builds the app first (next build), then runs the integration tests against it.
      - name: Build and tests
        run: npm test
      # After the build, because the type check reads the route types that `next build` generates.
      - name: Type check
        run: npx tsc --noEmit

  # The images that the server pulls (system_design.md §5: "Build Docker images", "docker-compose pull").
  # On a pull request they are only built, which proves both Dockerfiles still work.
  images:
    name: Image ${{ matrix.service }}
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write  # push to ghcr.io with the built-in GITHUB_TOKEN; no extra secret
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image names must be lowercase; the owner "venousSy" is not. Same names as compose.yaml.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tartus-menu-${{ matrix.service }}" >> "$GITHUB_ENV"
      # Tagged with the commit SHA (the deploy runs exactly this version) and "latest".
      # The layer cache lives in GitHub's Actions cache, so unchanged layers (npm ci) are not rebuilt.
      - uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # The whole product in a real browser (implementation_plan.md step 15): `npm run e2e` builds the images from
  # this commit, starts the Compose stack behind Nginx with a self-signed certificate (frontend/e2e/), seeds it,
  # runs the Playwright tests and deletes the stack again. All values are throwaway ones from e2e/e2e.env.
  e2e:
    name: End-to-end tests
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # Chromium and the Linux libraries it needs; the version comes from @playwright/test in the lockfile.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run e2e
      # The HTML report and the traces of the failed tests (playwright.config.ts: trace "retain-on-failure").
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  # system_design.md §5: SSH into the VPS, pull the new images, restart, migrate, create the cache table.
  # Secrets cannot be read in `if:`, so a repository variable switches the job on once the VPS exists.
  deploy:
    name: Deploy to the VPS
    # Only a version that passed every test, the end-to-end ones included, reaches the server.
    needs: [images, e2e]
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    # Deploys run one after another, never in parallel, and a running deploy is never cancelled.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # VPS_KNOWN_HOSTS is the server's own key: ssh refuses to talk to any other server.
      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      # The script between the EOF lines runs on the VPS. $1 = app folder, $2 = this commit's SHA.
      - name: Pull and restart on the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            bash -s -- "$VPS_APP_DIR" "$GITHUB_SHA" <<'EOF'
          set -euo pipefail
          cd "$1"
          # New compose.yaml and Nginx template from main.
          before=$(git rev-parse HEAD)
          git pull --ff-only
          # Run exactly the images built from this commit.
          export IMAGE_TAG="$2"
          docker compose pull backend frontend
          docker compose up -d
          # Nginx reads its template only when it starts: restart it only when the template changed.
          if ! git diff --quiet "$before" HEAD -- deploy/nginx; then
            docker compose restart nginx
          fi
          docker compose exec -T backend python manage.py migrate --noinput
          docker compose exec -T backend python manage.py createcachetable
          # Remove images that no container uses and that are older than 7 days (older versions stay
          # available for a quick rollback during that week).
          docker image prune -af --filter "until=168h"
          EOF
