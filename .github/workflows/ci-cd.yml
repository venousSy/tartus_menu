# CI/CD pipeline (system_design.md §5, "CI/CD Pipeline"; implementation_plan.md step 13).
# Pull requests into main: run every check. Pushes to main (merged PRs): the same checks; the image build
# and the deploy are added in steps 13.4 and 13.5.
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The jobs only read the code. Jobs that need more ask for it themselves.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the older, unfinished check run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    # A throwaway PostgreSQL 16, the same image as production.
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tartus_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tartus_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    # Development settings, like a local test run. Throwaway values only: nothing here is a real secret.
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      DB_NAME: tartus_db
      DB_USER: postgres
      DB_PASSWORD: ci-only-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: System check
        run: python manage.py check
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run
      # Production settings must pass Django's deploy checklist with no warning at all
      # (the two that Nginx covers are silenced in settings.py).
      - name: Deploy check
        env:
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: menu.example.com
          DJANGO_ADMIN_PATH: ci-hidden-admin
          PUBLIC_MENU_BASE_URL: https://menu.example.com
        run: python manage.py check --deploy --fail-level WARNING
      - name: Tests
        run: python manage.py test

  frontend-tests:
    name: Frontend lint, tests and types
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      # `npm test` builds the app first (next build), then runs the integration tests against it.
      - name: Build and tests
        run: npm test
      # After the build, because the type check reads the route types that `next build` generates.
      - name: Type check
        run: npx tsc --noEmit
