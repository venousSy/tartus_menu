# Production stack on one VPS (system_design.md §5, "Docker Services").
# Values come from the file .env next to this one (copy .env.example). Addresses inside the Docker network,
# and settings that must always be the same in production, are written here and not in .env.
# The backup service is added in step 14.

# Fixed project name: it prefixes the volumes (tartus-menu_pgdata), so they never collide with the
# local development database volume "tartus_pgdata".
name: tartus-menu

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # "Healthy" only once PostgreSQL accepts connections; the backend waits for it.
    # $$ keeps the $ for the container's shell instead of Compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      # "backend" is the host name Next.js uses on the Docker network (http://backend:8000).
      DJANGO_ALLOWED_HOSTS: ${DOMAIN:?set DOMAIN in .env},backend
      DJANGO_ADMIN_PATH: ${DJANGO_ADMIN_PATH:?set DJANGO_ADMIN_PATH in .env}
      # One proxy (Nginx) in front of Django on both paths (system_design.md §3.6).
      DJANGO_NUM_PROXIES: "1"
      LOGIN_THROTTLE_RATE: ${LOGIN_THROTTLE_RATE:-5/min}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      FRONTEND_REVALIDATE_URL: http://frontend:3000/internal/revalidate
      FRONTEND_REVALIDATE_SECRET: ${FRONTEND_REVALIDATE_SECRET:?set FRONTEND_REVALIDATE_SECRET in .env}
      PUBLIC_MENU_BASE_URL: https://${DOMAIN}
      # Uploaded images always go to R2: a container's own disk is lost when it is replaced.
      USE_S3: "True"
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?set R2_ACCESS_KEY_ID in .env}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?set R2_SECRET_ACCESS_KEY in .env}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:?set R2_BUCKET_NAME in .env}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:?set R2_ENDPOINT_URL in .env}
      R2_CUSTOM_DOMAIN: ${R2_CUSTOM_DOMAIN:?set R2_CUSTOM_DOMAIN in .env}
    volumes:
      # collectstatic writes the Django admin's CSS and JS here at every start; Nginx will serve them.
      - static:/app/staticfiles

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DJANGO_API_URL: http://backend:8000/api/v1
      FRONTEND_REVALIDATE_SECRET: ${FRONTEND_REVALIDATE_SECRET}

  # The only service with published ports: everything from the internet goes through it.
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Filled into deploy/nginx/default.conf.template when the container starts.
      DOMAIN: ${DOMAIN}
      DJANGO_ADMIN_PATH: ${DJANGO_ADMIN_PATH}
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - static:/var/www/static:ro
      # Certificates and the renewal folder of Certbot, which runs on the VPS host (step 12 decision D2).
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro

volumes:
  pgdata:
  static:
